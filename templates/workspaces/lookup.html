<!-- WORKSPACE 5: LEDGER RECORDS LOOKUP -->
<div id="menu-workspace-lookup" class="flex-1 p-3 sm:p-4 md:p-8 overflow-y-auto hidden workspace-pane bg-pzdark print:hidden flex-col custom-scrollbar">
    <div class="max-w-4xl mx-auto w-full bg-pzpanel p-4 sm:p-6 rounded-2xl border-2 border-white/[0.06] shadow-xl space-y-4">
        
        <!-- Search Controls Header -->
        <div class="flex flex-col sm:flex-row justify-between border-b-2 border-white/5 pb-4 gap-3">
            <div>
                <h2 class="text-base sm:text-xl font-black text-white uppercase tracking-widest">🔍 Customer Ledger Lookup</h2>
                <p class="text-xs font-medium text-slate-400 mt-1 tracking-wider">Search transaction history and reprint receipts</p>
            </div>
            <div class="flex flex-col gap-2">
                <div class="flex items-center gap-2">
                    <input type="text" id="filter-lookup-code" placeholder="Client Code" class="flex-1 bg-[#1b2020] border-2 border-white/[0.08] text-white rounded-lg px-3 py-2 text-sm font-mono h-10 outline-none focus:border-amber-500 shadow-inner">
                    <button type="button" onclick="filterLookupOrdersByCode()" class="bg-amber-500 hover:bg-amber-400 text-pzdark font-black text-[10px] uppercase px-4 py-2.5 rounded-lg active:scale-95 h-10 border border-transparent transition-all">Find</button>
                    <button type="button" onclick="resetLookupFilter()" class="bg-[#1b2020] hover:bg-slate-700 text-slate-300 font-black text-[10px] uppercase px-3 py-2.5 rounded-lg active:scale-95 h-10 border border-white/[0.08] transition-all">Reset</button>
                </div>
                <div class="flex items-center gap-2">
                    <input type="text" id="filter-lookup-invoice" placeholder="INV-..." class="flex-1 bg-[#1b2020] border-2 border-amber-500/30 text-amber-400 rounded-lg px-3 py-2 text-sm font-mono h-10 outline-none focus:border-amber-500 shadow-inner">
                    <button type="button" onclick="filterLookupOrdersByInvoice()" class="bg-amber-500 hover:bg-amber-400 text-pzdark font-black text-[10px] uppercase px-4 py-2.5 rounded-lg active:scale-95 w-full sm:w-[95px] h-10 border border-transparent transition-all">Bill</button>
                </div>
            </div>
        </div>

        <!-- Order Selector and Actions -->
        <div class="space-y-3">
            <label class="block text-[10px] font-extrabold uppercase text-slate-400 tracking-wider">Select Target Order</label>
            <div class="flex flex-col sm:flex-row gap-2">
                <select id="lookup-order-select" onchange="populateOrderDetailsView(this.value)" class="w-full sm:flex-1 bg-[#1b2020] border-2 border-white/[0.08] text-white rounded-lg p-2.5 text-sm font-bold h-10 outline-none cursor-pointer focus:border-amber-500 shadow-inner">
                    <option value="">-- Choose sequence --</option>
                    {% for order in orders %}
                        <option value="{{ order.id }}" data-custcode="{{ order.customer_code }}" data-invoiceno="{{ order.invoice_no }}">{{ order.invoice_no }} | {{ order.customer_name }}</option>
                    {% endfor %}
                </select>
                <div class="flex gap-2">
                    <button type="button" onclick="printArchivedReceipt()" class="flex-1 bg-[#1b2020] hover:bg-slate-700 text-slate-200 font-black text-[10px] uppercase px-4 py-2 rounded-lg active:scale-95 h-10 border border-white/[0.08] transition-all">🖨 Reprint</button>
                    <button type="button" onclick="downloadPDFReceipt()" class="flex-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 font-black text-[10px] uppercase px-4 py-2 rounded-lg active:scale-95 h-10 border border-rose-500/20 transition-all">📥 PDF</button>
                </div>
            </div>
        </div>

        <!-- Display Box for Transaction Details -->
        <div id="lookup-display-box" class="bg-pzdark p-4 sm:p-6 rounded-xl border-2 border-white/5 shadow-inner hidden space-y-4 animate-fade-up">
            <div class="flex justify-between border-b-2 border-white/5 pb-3">
                <div>
                    <h3 id="view-receipt-id" class="text-base sm:text-lg font-black font-mono text-white">BILL: ---</h3>
                    <p id="view-receipt-cust-code" class="text-[10px] font-mono font-black text-amber-500 mt-1">CUST: ------</p>
                </div>
                <div class="text-right">
                    <span class="text-[9px] font-black uppercase mb-0.5 text-slate-400 block tracking-widest">Total</span>
                    <span id="view-receipt-total" class="text-xl sm:text-2xl font-black text-amber-500 tracking-tight">₹0.00</span>
                </div>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs sm:text-sm border-b-2 border-white/5 pb-4">
                <div>
                    <span class="text-[9px] font-black uppercase mb-1 block text-slate-400 tracking-widest">Customer</span>
                    <p id="view-receipt-name" class="font-black text-sm text-white">---</p>
                    <p id="view-receipt-email" class="font-bold text-xs mt-0.5 text-slate-400">---</p>
                </div>
                <div>
                    <span class="text-[9px] font-black uppercase mb-1 block text-slate-400 tracking-widest">Phone / Payment</span>
                    <p class="font-black font-mono text-sm text-slate-200"><span id="view-receipt-phone">---</span> // <span id="view-receipt-method" class="text-amber-500">Cash</span></p>
                </div>
                <div class="sm:col-span-2">
                    <span class="text-[9px] font-black uppercase mb-1 block text-slate-400 tracking-widest">Destination</span>
                    <p id="view-receipt-address" class="font-bold bg-[#1b2020] p-2 rounded-lg border-2 border-white/[0.08] mt-1 text-slate-300">---</p>
                </div>
            </div>
            
            <div>
                <span class="text-[9px] font-black uppercase mb-2 block text-slate-400 tracking-widest">Ledger Items</span>
                <div id="view-receipt-items-container" class="space-y-2"></div>
            </div>
            
            <div id="view-receipt-history-box" class="hidden mt-4 border-t-4 border-dashed border-white/[0.08] pt-4">
                <span class="text-[10px] font-black text-amber-500 uppercase mb-2 block tracking-widest">⚠️ Audit Trail</span>
                <div id="view-receipt-history-container" class="space-y-2"></div>
            </div>
        </div>
        
        <p id="lookup-placeholder-msg" class="text-slate-400 text-center py-10 text-xs font-bold uppercase tracking-widest">Pick a transaction above to view details.</p>
    </div>
</div>
