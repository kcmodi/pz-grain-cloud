<!-- WORKSPACE 1: SALES POS TERMINAL -->
<div id="menu-workspace-create" class="flex-1 overflow-y-auto hidden workspace-pane bg-pzdark print:hidden flex-col lg:flex-row custom-scrollbar">
    <div class="w-full lg:w-2/3 p-3 md:p-4 flex flex-col gap-4 lg:overflow-y-auto custom-scrollbar">
        
        <!-- Customer Profile Section -->
        <div class="bg-pzpanel p-4 sm:p-5 rounded-xl border-2 border-white/[0.06] shadow-md space-y-3 relative z-10">
            <div class="flex flex-col md:flex-row md:items-center justify-between border-b-2 border-white/5 pb-2 gap-2">
                <!-- 👇 CHANGED TO DARKER BLUE 👇 -->
                <h3 class="text-xs sm:text-sm font-black text-blue-600 uppercase tracking-widest">Customer Profile</h3>
                <div class="flex items-center gap-2 w-full md:w-auto">
                    <div class="relative w-full md:w-64 z-30">
                        <!-- 👇 FOCUS RING CHANGED TO DARKER BLUE 👇 -->
                        <input type="text" id="sales-cust-search" oninput="runLiveBarSearch(this.value, 'sales')" placeholder="🔍 Search Name/Phone..." class="bg-[#1b2020] border-2 border-white/[0.08] rounded-lg px-2 sm:px-3 py-1.5 text-xs font-bold outline-none w-full focus:border-blue-600 transition shadow-inner h-9 text-white">
                        <div id="sales-search-dropdown" class="absolute left-0 right-0 top-full mt-1 bg-pzpanel border-2 border-white/[0.06] rounded-xl shadow-2xl max-h-56 overflow-y-auto hidden divide-y divide-white/5 z-[100] custom-scrollbar"></div>
                    </div>
                    <button type="button" onclick="setWalkInCustomer()" class="bg-slate-700 hover:bg-slate-600 text-white font-black text-[10px] uppercase px-3 py-1.5 rounded-lg cursor-pointer transition-colors shadow-sm active:scale-95 shrink-0 h-9">Walk-in</button>
                    <!-- 👇 SAVE BUTTON CHANGED TO DARKER BLUE 👇 -->
                    <button type="button" onclick="savePOSCustomer()" class="bg-blue-600 hover:bg-blue-500 text-white font-black text-[10px] uppercase px-4 py-1.5 rounded-lg cursor-pointer transition-colors shadow-lg active:scale-95 shrink-0 h-9 border border-transparent">💾 Save</button>
                </div>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2 sm:gap-3">
                <div>
                    <label class="block text-[9px] sm:text-[10px] font-extrabold text-slate-400 uppercase mb-0.5">Code</label>
                    <input type="text" id="cust-code" placeholder="New Account" readonly class="w-full bg-[#1b2020] border-2 border-white/[0.08] rounded-lg px-2 py-1 text-xs font-mono font-black text-blue-500 text-center outline-none h-8">
                </div>
                <div class="sm:col-span-2 lg:col-span-2">
                    <label class="block text-[9px] sm:text-[10px] font-extrabold text-slate-400 uppercase mb-0.5">Name / Firm</label>
                    <input type="text" id="cust-name" placeholder="John Doe" class="w-full bg-[#1b2020] border-2 border-white/[0.08] rounded-lg px-2 py-1 text-xs font-bold text-white outline-none focus:border-blue-600 transition-colors h-8">
                </div>
                <div>
                    <label class="block text-[9px] sm:text-[10px] font-extrabold text-slate-400 uppercase mb-0.5">Contact</label>
                    <input type="text" id="cust-phone" placeholder="+91..." class="w-full bg-[#1b2020] border-2 border-white/[0.08] rounded-lg px-2 py-1 text-xs font-mono font-bold text-white outline-none focus:border-blue-600 transition-colors h-8">
                </div>

                <!-- 5-PART ADDRESS BLOCK FOR POS -->
                <div class="col-span-1 sm:col-span-2 lg:col-span-4 grid grid-cols-2 md:grid-cols-5 gap-2 border-t-2 border-white/5 pt-2 mt-1">
                    <div class="col-span-2 md:col-span-1">
                        <label class="block text-[9px] sm:text-[10px] font-extrabold text-slate-400 uppercase mb-0.5">Apt / Society</label>
                        <input type="text" id="cust-apt" placeholder="Shop 5" class="w-full bg-[#1b2020] border-2 border-white/[0.08] rounded-lg px-2 py-1 text-xs font-bold text-white outline-none focus:border-blue-600 h-8">
                    </div>
                    <div class="col-span-2 md:col-span-1">
                        <label class="block text-[9px] sm:text-[10px] font-extrabold text-slate-400 uppercase mb-0.5">Area</label>
                        <input type="text" id="cust-area" placeholder="Navrangpura" oninput="autoFillLocation('cust')" class="w-full bg-[#1b2020] border-2 border-white/[0.08] rounded-lg px-2 py-1 text-xs font-bold text-white outline-none focus:border-blue-600 h-8">
                    </div>
                    <div>
                        <label class="block text-[9px] sm:text-[10px] font-extrabold text-slate-400 uppercase mb-0.5">City</label>
                        <input type="text" id="cust-city" placeholder="Ahmedabad" class="w-full bg-[#1b2020] border-2 border-white/[0.08] rounded-lg px-2 py-1 text-xs font-bold text-white outline-none focus:border-blue-600 h-8">
                    </div>
                    <div>
                        <label class="block text-[9px] sm:text-[10px] font-extrabold text-slate-400 uppercase mb-0.5">State</label>
                        <input type="text" id="cust-state" placeholder="GJ" class="w-full bg-[#1b2020] border-2 border-white/[0.08] rounded-lg px-2 py-1 text-xs font-bold text-white outline-none focus:border-blue-600 h-8">
                    </div>
                    <div>
                        <label class="block text-[9px] sm:text-[10px] font-extrabold text-slate-400 uppercase mb-0.5">Zipcode</label>
                        <input type="text" id="cust-zipcode" placeholder="380009" class="w-full bg-[#1b2020] border-2 border-white/[0.08] rounded-lg px-2 py-1 text-xs font-bold text-white outline-none focus:border-blue-600 h-8">
                    </div>
                </div>
            </div>
        </div>

        <!-- Logistics Section -->
        <div class="bg-pzpanel p-4 sm:p-5 rounded-xl border-2 border-white/[0.06] shadow-md space-y-3 z-0">
            <h3 class="text-[11px] sm:text-xs font-black text-white uppercase tracking-widest border-b-2 border-white/5 pb-2">Logistics & Handling</h3>
            <div class="flex flex-wrap gap-4 sm:gap-6 mt-2">
                <label class="flex items-center gap-2 cursor-pointer group">
                    <input type="radio" name="fulfillment-opt" value="Takeaway" checked class="w-4 h-4 text-blue-600 bg-[#1b2020] border-white/10 focus:ring-blue-600 focus:ring-2">
                    <span class="text-xs font-bold text-slate-300 group-hover:text-blue-500 transition-colors">Takeaway (Customer Pickup)</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer group">
                    <input type="radio" name="fulfillment-opt" value="Delivery" class="w-4 h-4 text-blue-600 bg-[#1b2020] border-white/10 focus:ring-blue-600 focus:ring-2">
                    <span class="text-xs font-bold text-slate-300 group-hover:text-blue-500 transition-colors">Fleet Delivery (Add to Dispatch)</span>
                </label>
            </div>
        </div>

        <!-- Fast Barcode / Search Terminal -->
        <div class="bg-pzpanel p-4 sm:p-5 rounded-xl border-2 border-white/[0.06] shadow-md space-y-3 z-0">
            <h3 class="text-[11px] sm:text-xs font-black text-white uppercase tracking-widest border-b-2 border-white/5 pb-2">Commodity Terminal</h3>
            <div class="flex flex-col md:flex-row items-start gap-3 sm:gap-4">
                <div class="w-full md:w-1/4">
                    <label class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1">Entry Code</label>
                    <input type="text" id="terminal-code" placeholder="e.g., 101" maxlength="3" oninput="checkGrainCode(this.value, 'create')" class="w-full bg-[#1b2020] border-2 border-white/[0.08] rounded-lg p-2.5 font-mono text-lg font-black text-center shadow-inner focus:border-blue-600 transition-all outline-none text-white h-12">
                </div>
                <div class="w-full md:flex-1">
                    <label class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1">Match Preview</label>
                    <div id="item-preview-box" class="h-12 flex items-center bg-[#1b2020] border-2 border-dashed border-white/[0.08] rounded-lg px-3 text-xs font-bold text-slate-400 transition-colors">Waiting for code...</div>
                </div>
                <div class="w-full md:w-[25%]">
                    <label class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1">Weight (kg)</label>
                    <div class="flex gap-1">
                        <input type="number" id="terminal-qty" value="50" min="1" disabled class="w-full bg-pzdark border-2 border-white/[0.04] rounded-lg p-2.5 text-lg font-black text-center text-slate-500 outline-none h-12">
                        <button type="button" onclick="connectHardwareScale('terminal-qty')" title="Fetch Weight from Digital Scale" class="bg-blue-600 text-white px-3 rounded-lg hover:bg-blue-500 active:scale-95 transition-all h-12 border-2 border-transparent flex items-center justify-center text-lg">⚖️</button>
                    </div>
                </div>
            </div>
            <div class="flex justify-end pt-1">
                <button type="button" id="add-to-manifest-btn" onclick="processTerminalEntry('create')" disabled class="w-full md:w-auto bg-[#1b2020] text-slate-500 font-black py-2 px-6 rounded-lg text-xs uppercase cursor-not-allowed shadow-md transition-all border-2 border-white/[0.06] h-10">Add to Cart</button>
            </div>
        </div>
    </div>

    <!-- RIGHT SIDEBAR: MANIFEST CART -->
    <div class="w-full lg:w-1/3 bg-pzpanel border-t-4 lg:border-t-0 lg:border-l-4 border-white/[0.06] shadow-2xl flex flex-col relative z-10 shrink-0 lg:h-full lg:overflow-hidden min-h-[500px] lg:min-h-0">
        <div class="flex flex-col flex-1 min-h-0 overflow-hidden">
            <div class="p-3 sm:p-4 pb-2 shrink-0 border-b-2 border-white/5 mx-3 sm:mx-4 mt-3 flex justify-between items-center">
                <h2 class="text-sm font-black text-white uppercase tracking-widest">Active Cart</h2>
                <span class="text-[10px] font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">LIVE</span>
            </div>
            <div id="manifest-container" class="flex-1 overflow-y-auto px-3 sm:px-4 py-2 space-y-2 min-h-[80px] custom-scrollbar">
                <div class="flex flex-col items-center justify-center py-10 text-slate-500 gap-2">
                    <span class="text-3xl">🛒</span>
                    <p class="text-xs font-bold tracking-wide">No entries loaded</p>
                </div>
            </div>
        </div>
        
        <div class="shrink-0 flex flex-col bg-pzdark border-t-2 border-white/5">
            <div class="p-3 sm:p-4 pb-2 flex justify-between text-xs font-bold text-slate-400 border-b border-white/5 mx-2">
                <span>Subtotal:</span><span id="pos-subtotal" class="font-mono text-white">₹0.00</span>
            </div>
            <div class="p-3 sm:p-4 py-2 flex justify-between text-[10px] font-bold text-amber-500 border-b border-white/5 mx-2">
                <span>Tax (GST/VAT):</span><span id="pos-tax" class="font-mono">₹0.00</span>
            </div>
            <div class="p-3 sm:p-4 pt-3">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-xs font-black text-slate-400 uppercase tracking-widest">Grand Total</span>
                    <span id="total-price" class="text-3xl font-black text-white tracking-tight drop-shadow-md">₹0.00</span>
                </div>
                
                <div class="mb-4">
                    <label class="block text-[10px] font-extrabold text-slate-400 uppercase mb-1.5">Payment Routing</label>
                    <select id="create-pay-method" onchange="toggleSplitPanel('create')" class="w-full bg-[#1b2020] border-2 border-white/[0.08] text-white rounded-lg p-2.5 text-xs font-bold outline-none cursor-pointer focus:border-blue-600 transition-colors">
                        <option value="Cash">Cash (Physical)</option>
                        <option value="UPI">UPI / Digital Wallet</option>
                        <option value="Card">Credit/Debit Card</option>
                        <option value="Net Banking">Net Banking / Transfer</option>
                        <option value="Check">Check</option>
                        <option value="Pay Later">Pay Later (Add to Market Dues)</option>
                        <option value="Cash on Delivery">Cash on Delivery (COD)</option>
                        <option value="Split">🔀 Split Payment / Multi-Tender</option>
                    </select>
                </div>

                <div id="create-split-panel" class="hidden bg-[#1b2020] border-2 border-blue-600/30 rounded-xl p-3 mb-4 shadow-inner">
                    <p class="text-[9px] font-black text-blue-600 uppercase tracking-widest mb-2 text-center">Split Tender Routing</p>
                    <div class="space-y-2">
                        <div class="flex items-center gap-2"><span class="w-16 text-[10px] font-bold text-slate-300">Cash:</span><input type="number" id="split-create-cash" placeholder="0.00" class="flex-1 bg-pzdark border border-white/10 rounded px-2 py-1 text-xs font-mono text-white text-right focus:border-blue-600 outline-none"></div>
                        <div class="flex items-center gap-2"><span class="w-16 text-[10px] font-bold text-slate-300">UPI:</span><input type="number" id="split-create-upi" placeholder="0.00" class="flex-1 bg-pzdark border border-white/10 rounded px-2 py-1 text-xs font-mono text-white text-right focus:border-blue-600 outline-none"></div>
                        <div class="flex items-center gap-2"><span class="w-16 text-[10px] font-bold text-slate-300">Card:</span><input type="number" id="split-create-card" placeholder="0.00" class="flex-1 bg-pzdark border border-white/10 rounded px-2 py-1 text-xs font-mono text-white text-right focus:border-blue-600 outline-none"></div>
                        <div class="flex items-center gap-2"><span class="w-16 text-[10px] font-bold text-slate-300">Bank:</span><input type="number" id="split-create-bank" placeholder="0.00" class="flex-1 bg-pzdark border border-white/10 rounded px-2 py-1 text-xs font-mono text-white text-right focus:border-blue-600 outline-none"></div>
                        <div class="flex items-center gap-2"><span class="w-16 text-[10px] font-bold text-slate-300">Check:</span><input type="number" id="split-create-check" placeholder="0.00" class="flex-1 bg-pzdark border border-white/10 rounded px-2 py-1 text-xs font-mono text-white text-right focus:border-blue-600 outline-none"></div>
                    </div>
                </div>

                <!-- 👇 CHANGED TO DARKER BLUE 👇 -->
                <button type="button" onclick="submitGrainOrder()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-3 sm:py-3.5 px-4 rounded-xl text-xs sm:text-sm uppercase tracking-widest shadow-xl shadow-blue-900/30 active:scale-95 transition-all border border-transparent">Print & Commit Invoice</button>
            </div>
        </div>
    </div>
</div>
