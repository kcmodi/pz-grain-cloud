<!-- WORKSPACE 3.5: SETTLE PENDING DUES -->
<div id="menu-workspace-pending" class="flex-1 p-3 md:p-4 overflow-y-auto lg:overflow-hidden hidden workspace-pane bg-pzdark print:hidden flex-col lg:flex-row gap-4 relative z-10 custom-scrollbar">
    
    <!-- LEFT PANEL: Pending Orders List -->
    <div class="w-full lg:w-1/2 flex flex-col gap-4 lg:overflow-y-auto pr-0 lg:pr-2 custom-scrollbar">
        <div class="bg-gradient-to-r from-slate-900 via-pzpanel to-slate-900 text-white p-4 rounded-xl flex flex-col lg:flex-row justify-between lg:items-center shadow-md border-2 border-white/[0.06] gap-3">
            <div class="flex-1 w-full lg:w-auto"><h2 class="text-sm sm:text-base font-black tracking-widest uppercase">⏳ Pending Dues</h2></div>
            <div class="flex-1 w-full lg:w-auto"><input type="text" id="pending-search-input" oninput="filterPendingOrders()" placeholder="🔍 Search..." class="w-full bg-pzdark border-2 border-white/[0.08] rounded-lg px-3 py-1.5 text-xs outline-none h-9 text-white focus:border-amber-500"></div>
            <button type="button" onclick="loadPendingOrders()" class="w-full lg:w-auto bg-amber-500 hover:bg-amber-400 text-pzdark font-black text-[10px] uppercase px-4 py-1.5 rounded-lg active:scale-95 h-9 border border-transparent transition-all">🔄 Refresh</button>
        </div>
        <div id="pending-list-container" class="space-y-2 pb-4 custom-scrollbar"><p class="text-xs text-center py-10 font-bold text-slate-400">Click refresh to load.</p></div>
    </div>
    
    <!-- RIGHT PANEL: Settlement Details & Payment Actions -->
    <div class="w-full lg:w-1/2 bg-pzpanel border-2 border-white/[0.06] rounded-xl shadow-2xl flex flex-col justify-between hidden shrink-0 lg:h-full lg:overflow-hidden min-h-[500px] lg:min-h-0" id="pending-detail-panel">
        <div class="flex flex-col flex-1 min-h-0 overflow-hidden">
            <div class="p-4 shrink-0 border-b-2 border-white/5 mx-2 mt-2">
                <h2 class="text-lg font-black font-mono text-white" id="pending-detail-invoice">INV-123</h2>
                <p class="text-xs font-extrabold mt-1 text-slate-200" id="pending-detail-name">Name</p>
                <p class="text-[10px] font-mono font-bold mt-0.5 text-slate-400" id="pending-detail-phone">Phone</p>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-2 custom-scrollbar">
                <h3 class="text-[9px] font-black uppercase text-slate-400 mb-2">Itemized Details</h3>
                <div id="pending-detail-items" class="space-y-1.5"></div>
            </div>
        </div>
        
        <div class="shrink-0 flex flex-col bg-pzdark border-t-2 border-white/5 max-h-[60vh] lg:max-h-[55vh]">
            <div class="flex-1 min-h-0 overflow-y-auto p-4 space-y-3 custom-scrollbar">
                <div class="flex justify-between items-center pb-2 border-b-2 border-white/5">
                    <span class="text-[10px] font-black uppercase text-slate-400">Total Due</span>
                    <span id="pending-detail-total" class="text-2xl font-black text-rose-400">₹0.00</span>
                </div>
                <div>
                    <label class="block text-[9px] font-black uppercase mb-1 text-slate-400">Settle Via</label>
                    <select id="pending-settle-method" onchange="toggleSplitPanel('pending')" class="w-full bg-[#1b2020] border-2 border-white/[0.08] rounded-lg p-2 text-xs font-bold text-white cursor-pointer h-10 outline-none focus:border-amber-500">
                        <option value="Cash">💵 Cash</option>
                        <option value="UPI">📱 UPI</option>
                        <option value="Card">💳 Card</option>
                        <option value="Net Banking">🏦 Bank</option>
                        <option value="Check">📝 Check</option>
                        <option value="Split">🔀 Split Payment</option>
                    </select>
                    <div id="pending-split-panel" class="hidden mt-2 p-2 bg-[#1b2020] border-2 border-white/[0.06] rounded-lg grid grid-cols-1 sm:grid-cols-2 gap-2 shadow-inner">
                        <div><span class="block text-[9px] font-black mb-0.5 text-slate-400">💵 Cash</span><input type="number" id="split-pending-cash" class="w-full bg-pzpanel border-2 border-white/[0.08] text-white rounded p-1.5 text-xs font-bold outline-none focus:border-amber-500" min="0" value="0"></div>
                        <div><span class="block text-[9px] font-black mb-0.5 text-slate-400">📱 UPI</span><input type="number" id="split-pending-upi" class="w-full bg-pzpanel border-2 border-white/[0.08] text-white rounded p-1.5 text-xs font-bold outline-none focus:border-amber-500" min="0" value="0"></div>
                        <div><span class="block text-[9px] font-black mb-0.5 text-slate-400">💳 Card</span><input type="number" id="split-pending-card" class="w-full bg-pzpanel border-2 border-white/[0.08] text-white rounded p-1.5 text-xs font-bold outline-none focus:border-amber-500" min="0" value="0"></div>
                        <div><span class="block text-[9px] font-black mb-0.5 text-slate-400">🏦 Bank</span><input type="number" id="split-pending-bank" class="w-full bg-pzpanel border-2 border-white/[0.08] text-white rounded p-1.5 text-xs font-bold outline-none focus:border-amber-500" min="0" value="0"></div>
                        <div class="sm:col-span-2"><span class="block text-[9px] font-black mb-0.5 text-slate-400">📝 Check</span><input type="number" id="split-pending-check" class="w-full bg-pzpanel border-2 border-white/[0.08] text-white rounded p-1.5 text-xs font-bold outline-none focus:border-amber-500" min="0" value="0"></div>
                    </div>
                </div>
            </div>
            <div class="shrink-0 p-4 pt-2 shadow-[0_-5px_15px_rgba(0,0,0,0.05)] z-20">
                <input type="hidden" id="pending-settle-id">
                <button type="button" onclick="settlePendingPayment()" class="w-full bg-amber-500 hover:bg-amber-400 text-pzdark font-black py-3 rounded-xl text-[10px] uppercase active:scale-95 h-10 border border-transparent transition-all">✅ Mark Paid</button>
            </div>
        </div>
    </div>
</div>
