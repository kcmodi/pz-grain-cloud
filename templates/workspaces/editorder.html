<!-- WORKSPACE 3: EDIT EXISTING SALES ORDER -->
<div id="menu-workspace-editorder" class="flex-1 p-3 md:p-4 overflow-y-auto hidden workspace-pane bg-pzdark print:hidden flex-col lg:flex-row gap-4 relative z-10 custom-scrollbar">
    <div class="w-full lg:w-2/3 flex flex-col gap-4 lg:overflow-y-auto custom-scrollbar">
        
        <!-- Search & Select Invoice Box -->
        <div class="bg-gradient-to-r from-slate-900 via-pzpanel to-slate-900 text-white p-4 rounded-xl flex flex-col md:flex-row gap-3 items-end shadow-md border-2 border-white/[0.06] relative z-30">
            <div class="flex-1 w-full space-y-2">
                <label class="block text-[10px] font-black uppercase tracking-wider text-slate-300">Search by Invoice or Code</label>
                <input type="text" id="edit-filter-input" onkeyup="filterEditDropdown()" placeholder="INV-... or Code" class="w-full bg-pzdark border-2 border-white/[0.08] rounded-lg p-2 text-xs font-bold text-white outline-none focus:border-amber-500 transition-colors shadow-inner h-8">
                <label class="block text-[10px] font-black uppercase tracking-wider text-slate-300">Select Order ID Sequence to Edit</label>
                <select id="edit-target-id" class="w-full bg-pzdark border-2 border-white/[0.08] rounded-lg p-2 text-xs font-bold text-white outline-none focus:border-amber-500 transition-colors shadow-inner cursor-pointer h-8">
                    <option value="">-- Choose active order --</option>
                    {% for order in orders %}
                        <option value="{{ order.id }}" data-invoiceno="{{ order.invoice_no }}" data-custcode="{{ order.customer_code }}">Bill: {{ order.invoice_no }} | Code: {{ order.customer_code }} | Order #{{ order.id }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="button" onclick="loadOrderDataForEditing()" class="w-full md:w-auto bg-amber-500 hover:bg-amber-400 text-pzdark font-black text-[10px] uppercase px-6 py-2 rounded-lg shadow active:scale-95 transition-all border border-transparent h-8">Load Details</button>
        </div>

        <!-- Loaded Invoice Profile Fields -->
        <div class="bg-pzpanel p-4 rounded-xl border-2 border-white/[0.06] shadow-md space-y-3 relative z-20">
            <h3 class="text-[11px] font-black text-slate-200 uppercase tracking-widest border-b-2 border-white/5 pb-2">Loaded Invoice Profile Fields</h3>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <div class="col-span-1">
                    <label class="block text-[9px] font-extrabold uppercase mb-0.5 text-slate-400">Code</label>
                    <input type="text" id="edit-cust-code" readonly class="w-full bg-[#1b2020] border-2 border-white/[0.08] rounded-lg px-2 py-1.5 text-xs font-mono font-black h-8 text-amber-500">
                </div>
                <div class="col-span-1 sm:col-span-2">
                    <label class="block text-[9px] font-extrabold uppercase mb-0.5 text-slate-400">Name</label>
                    <input type="text" id="edit-cust-name" class="w-full bg-[#1b2020] border-2 border-white/[0.08] rounded-lg px-2 py-1.5 text-xs font-bold text-white h-8 outline-none focus:border-amber-500">
                </div>
                <div class="col-span-2 sm:col-span-1">
                    <label class="block text-[9px] font-extrabold uppercase mb-0.5 text-slate-400">Phone</label>
                    <input type="text" id="edit-cust-phone" class="w-full bg-[#1b2020] border-2 border-white/[0.08] rounded-lg px-2 py-1.5 text-xs font-mono font-bold text-white h-8 outline-none focus:border-amber-500">
                </div>
                <div class="col-span-2 sm:col-span-2">
                    <label class="block text-[9px] font-extrabold uppercase mb-0.5 text-slate-400">Address</label>
                    <input type="text" id="edit-cust-address" class="w-full bg-[#1b2020] border-2 border-white/[0.08] rounded-lg px-2 py-1.5 text-xs font-bold text-white h-8 outline-none focus:border-amber-500">
                </div>
                <div class="col-span-2 sm:col-span-2">
                    <label class="block text-[9px] font-extrabold uppercase mb-0.5 text-slate-400">Delivery Area</label>
                    <select id="edit-cust-area" class="w-full bg-[#1b2020] border-2 border-white/[0.08] rounded-lg px-2 py-1.5 text-xs font-bold text-white h-8 outline-none focus:border-amber-500 cursor-pointer">
                        <option value="">-- Keep Current Area --</option>
                        {% for area in areas %}<option value="{{ area.id }}">{{ area.name }}</option>{% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <!-- Append Item Variety Line -->
        <div class="bg-pzpanel p-4 rounded-xl border-2 border-white/[0.06] shadow-md space-y-3 relative z-10">
            <h3 class="text-[11px] font-black text-amber-500 uppercase tracking-widest border-b-2 border-white/5 pb-2">Append Item Variety Line</h3>
            <div class="flex flex-col md:flex-row items-start gap-3">
                <div class="w-full md:w-1/4">
                    <label class="block text-[10px] font-extrabold uppercase mb-1 text-slate-400">Code</label>
                    <input type="text" id="edit-terminal-code" maxlength="3" oninput="checkGrainCode(this.value, 'edit')" class="w-full bg-pzdark border-2 border-white/[0.08] rounded-lg p-2 text-center font-mono font-black text-lg h-10 outline-none text-white">
                </div>
                <div class="w-full md:flex-1">
                    <label class="block text-[10px] font-extrabold uppercase mb-1 text-slate-400">Preview</label>
                    <div id="edit-item-preview-box" class="h-10 flex items-center bg-pzdark border-2 border-dashed border-white/[0.08] rounded-lg px-3 text-xs font-bold text-slate-400">Waiting...</div>
                </div>
                <div class="w-full md:w-1/4">
                    <label class="block text-[10px] font-extrabold uppercase mb-1 text-slate-400">Qty (kg)</label>
                    <input type="number" id="edit-terminal-qty" value="50" min="1" disabled class="w-full bg-[#1b2020] border-2 border-white/[0.04] rounded-lg p-2 text-center text-lg font-black text-slate-500 outline-none h-10">
                </div>
            </div>
            <div class="flex justify-end pt-1">
                <button type="button" id="edit-add-to-manifest-btn" onclick="processTerminalEntry('edit')" disabled class="w-full md:w-auto bg-[#1b2020] text-slate-500 font-black py-2 px-6 rounded-lg text-xs uppercase cursor-not-allowed active:scale-95 transition-all border-2 border-white/[0.06] h-10">Add Item</button>
            </div>
        </div>
    </div>

    <!-- RIGHT SIDEBAR: ADJUSTED MANIFEST & SAVING -->
    <div class="w-full lg:w-1/3 bg-pzpanel lg:border-t-0 lg:border-l-4 border-white/[0.06] shadow-2xl flex flex-col relative z-10 shrink-0 lg:h-full lg:overflow-hidden min-h-[500px] lg:min-h-0">
        <div class="flex flex-col flex-1 min-h-0 overflow-hidden">
            <div class="p-3 sm:p-4 pb-0 shrink-0 border-b-2 border-white/5 mx-3 sm:mx-4 mt-3">
                <h2 class="text-sm font-black text-white uppercase tracking-widest pb-3 mb-2">Adjusted Manifest Cart</h2>
            </div>
            <div id="edit-manifest-container" class="flex-1 overflow-y-auto px-3 sm:px-4 py-2 space-y-2 min-h-[80px] custom-scrollbar">
                <p class="text-xs text-slate-400 text-center py-10 font-bold">Please load an order record file first...</p>
            </div>
            <div id="edit-history-box" class="hidden shrink-0 border-t-2 border-dashed border-white/[0.08] p-3 sm:p-4">
                <span class="text-[10px] font-black text-amber-500 uppercase tracking-widest block mb-2">⚠️ Edit History</span>
                <div id="edit-history-container" class="space-y-1 max-h-20 overflow-y-auto custom-scrollbar"></div>
            </div>
        </div>
        
        <div class="shrink-0 flex flex-col bg-pzdark border-t-2 border-white/5 max-h-[60vh] lg:max-h-[55vh]">
            <div class="flex-1 min-h-0 overflow-y-auto p-3 sm:p-4 space-y-3 custom-scrollbar">
                <div>
                    <label class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-1">Order Fulfillment</label>
                    <div class="flex gap-2 bg-[#1b2020] p-1 rounded-lg w-full shadow-inner border border-white/[0.06]">
                        <label class="flex-1 text-center relative cursor-pointer"><input type="radio" name="edit-fulfillment-opt" id="edit-fulfillment-takeaway" value="Takeaway" class="peer sr-only" checked><div class="py-2.5 px-3 text-sm font-black text-slate-400 rounded-lg peer-checked:bg-pzpanel peer-checked:text-amber-400 peer-checked:shadow-md transition-all border-2 border-transparent">🛍️ Takeaway</div></label>
                        <label class="flex-1 text-center relative cursor-pointer"><input type="radio" name="edit-fulfillment-opt" id="edit-fulfillment-delivery" value="Delivery" class="peer sr-only"><div class="py-2.5 px-3 text-sm font-black text-slate-400 rounded-lg peer-checked:bg-pzpanel peer-checked:text-amber-400 peer-checked:shadow-md transition-all border-2 border-transparent">🚚 Delivery</div></label>
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-1">Change Payment Method</label>
                    <select id="edit-pay-method" onchange="toggleSplitPanel('edit')" class="w-full bg-[#1b2020] border-2 border-white/[0.08] rounded-lg p-2 text-xs font-bold text-white outline-none cursor-pointer focus:border-amber-500 h-10">
                        <option value="Cash">💵 Cash</option>
                        <option value="UPI">📱 UPI / QR</option>
                        <option value="Card">💳 Card Swipe</option>
                        <option value="Net Banking">🏦 Net Banking</option>
                        <option value="Check">📝 Check</option>
                        <option value="Cash on Delivery">🚚 COD</option>
                        <option value="Pay Later">⏳ Pay Later</option>
                        <option value="Split">🔀 Split Payment</option>
                    </select>
                    <div id="edit-split-panel" class="hidden mt-2 p-2 bg-[#1b2020] border-2 border-white/[0.06] rounded-lg grid grid-cols-1 sm:grid-cols-2 gap-2 shadow-inner">
                        <div><span class="block text-[9px] font-black text-slate-400 mb-0.5">💵 Cash</span><input type="number" id="split-edit-cash" class="w-full bg-pzpanel border-2 border-white/[0.08] rounded text-xs font-bold text-white outline-none focus:border-amber-500 p-1.5" min="0" value="0"></div>
                        <div><span class="block text-[9px] font-black text-slate-400 mb-0.5">📱 UPI</span><input type="number" id="split-edit-upi" class="w-full bg-pzpanel border-2 border-white/[0.08] rounded text-xs font-bold text-white outline-none focus:border-amber-500 p-1.5" min="0" value="0"></div>
                        <div><span class="block text-[9px] font-black text-slate-400 mb-0.5">💳 Card</span><input type="number" id="split-edit-card" class="w-full bg-pzpanel border-2 border-white/[0.08] rounded text-xs font-bold text-white outline-none focus:border-amber-500 p-1.5" min="0" value="0"></div>
                        <div><span class="block text-[9px] font-black text-slate-400 mb-0.5">🏦 Bank</span><input type="number" id="split-edit-bank" class="w-full bg-pzpanel border-2 border-white/[0.08] rounded text-xs font-bold text-white outline-none focus:border-amber-500 p-1.5" min="0" value="0"></div>
                        <div class="sm:col-span-2"><span class="block text-[9px] font-black text-slate-400 mb-0.5">📝 Check</span><input type="number" id="split-edit-check" class="w-full bg-pzpanel border-2 border-white/[0.08] rounded text-xs font-bold text-white outline-none focus:border-amber-500 p-1.5" min="0" value="0"></div>
                    </div>
                </div>
            </div>
            <div class="shrink-0 p-3 sm:p-4 pt-2 border-t-2 border-white/5 shadow-[0_-5px_15px_rgba(0,0,0,0.05)] z-20">
                <div class="flex flex-col gap-0.5 pb-1">
                    <div class="flex justify-between items-center text-[10px] sm:text-xs font-bold text-slate-400"><span>Items Subtotal</span><span id="pos-edit-subtotal">₹0.00</span></div>
                    <div class="flex justify-between items-center text-[10px] sm:text-xs font-bold text-slate-400"><span>Combined Taxes</span><span id="pos-edit-tax">₹0.00</span></div>
                </div>
                <div class="flex justify-between items-center border-t-2 border-white/5 pt-1.5 mb-2">
                    <span class="text-xs sm:text-sm font-black text-slate-400 uppercase tracking-widest">Adjusted Total</span>
                    <span id="edit-total-price" class="text-xl sm:text-2xl font-black text-white tracking-tight">₹0.00</span>
                </div>
                <button type="button" onclick="submitModifiedOrder()" class="w-full bg-amber-500 hover:bg-amber-400 text-pzdark font-black py-3 px-4 rounded-xl text-xs uppercase tracking-widest shadow-xl active:scale-95 transition-all h-12 shrink-0">Save Overwrites</button>
            </div>
        </div>
    </div>
</div>
