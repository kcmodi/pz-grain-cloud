<!-- WORKSPACE: ADMIN CONFIG & STAFF ONBOARDING -->
<div id="menu-workspace-adminsetup" class="flex-1 p-4 md:p-8 overflow-y-auto hidden workspace-pane bg-pzdark flex-col gap-6 custom-scrollbar animate-page-fade">
    <div class="max-w-3xl mx-auto w-full">
        <div class="bg-pzpanel border-2 border-white/[0.06] rounded-3xl p-6 shadow-xl relative z-10">
            <div class="flex justify-between items-center mb-6 border-b-2 border-white/5 pb-4">
                <h2 class="text-xl font-black text-white tracking-wider flex items-center gap-3">
                    <span class="p-2 bg-amber-500/20 text-amber-500 rounded-xl">➕</span> 
                    Staff Onboarding & Access
                </h2>
                <button type="button" onclick="document.getElementById('setup-form').reset(); document.getElementById('setup-emp-code').value=''; document.getElementById('setup-submit-btn').innerText='Authorize & Create';" class="text-[10px] text-slate-500 hover:text-white uppercase font-bold tracking-widest transition-colors">Clear ✕</button>
            </div>

            <div id="setup-status-msg" class="hidden"></div>

            <form id="setup-form" onsubmit="createProfileWorkspace(event)" class="space-y-6">
                <input type="hidden" id="setup-emp-code">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-[10px] font-extrabold text-slate-400 uppercase mb-1.5 ml-1">Full Legal Name</label>
                        <input type="text" id="setup-name" required placeholder="John Doe" class="w-full bg-[#1b2020] border-2 border-white/[0.08] rounded-xl px-4 py-3 text-sm font-bold text-white outline-none focus:border-amber-500 transition-colors">
                    </div>
                    <div>
                        <label class="block text-[10px] font-extrabold text-slate-400 uppercase mb-1.5 ml-1">Contact Phone</label>
                        <input type="text" id="setup-phone" placeholder="+91..." class="w-full bg-[#1b2020] border-2 border-white/[0.08] rounded-xl px-4 py-3 text-sm font-mono font-bold text-white outline-none focus:border-amber-500 transition-colors">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-[10px] font-extrabold text-slate-400 uppercase mb-1.5 ml-1">Security Role</label>
                        <select id="setup-role" class="w-full bg-[#1b2020] border-2 border-white/[0.08] rounded-xl px-4 py-3 text-sm font-bold text-white outline-none focus:border-amber-500 transition-colors cursor-pointer">
                            <option value="Staff">Warehouse Staff (Restricted)</option>
                            <option value="Manager">Branch Manager</option>
                            <option value="Admin">System Administrator</option>
                            <option value="Owner">Owner (Full Access)</option>
                        </select>
                    </div>
                    <!-- 👇 NEW BRANCH DROPDOWN 👇 -->
                    <div>
                        <label class="block text-[10px] font-extrabold text-slate-400 uppercase mb-1.5 ml-1">Branch Assignment</label>
                        <select id="setup-branch" class="w-full bg-[#1b2020] border-2 border-white/[0.08] rounded-xl px-4 py-3 text-sm font-bold text-white outline-none focus:border-amber-500 transition-colors cursor-pointer">
                            <option value="NV">Navrangpura (NV)</option>
                            <option value="NN">Nehrunagar (NN)</option>
                            <option value="BP">Bopal (BP)</option>
                            <option value="ALL">All Branches (HQ)</option>
                        </select>
                    </div>
                </div>

                <div class="border-t-2 border-white/5 pt-6 mt-2">
                    <h3 class="text-xs font-black text-amber-500 uppercase tracking-widest mb-4">Digital Login Credentials</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-[10px] font-extrabold text-slate-400 uppercase mb-1.5 ml-1">System Username</label>
                            <input type="text" id="setup-username" placeholder="jdoe26" class="w-full bg-[#1b2020] border-2 border-white/[0.08] rounded-xl px-4 py-3 text-sm font-bold text-white outline-none focus:border-amber-500 transition-colors">
                        </div>
                        <div>
                            <label class="block text-[10px] font-extrabold text-slate-400 uppercase mb-1.5 ml-1">Secure Password</label>
                            <input type="password" id="setup-password" placeholder="••••••••" class="w-full bg-[#1b2020] border-2 border-white/[0.08] rounded-xl px-4 py-3 text-sm font-mono font-bold text-white outline-none focus:border-amber-500 transition-colors">
                        </div>
                    </div>
                </div>

                <div class="pt-4 border-t-2 border-white/5 flex justify-end">
                    <button type="submit" id="setup-submit-btn" class="bg-amber-500 hover:bg-amber-400 text-pzdark px-8 py-3 rounded-xl font-black text-xs uppercase tracking-widest transition-all shadow-lg active:scale-95">Authorize & Create</button>
                </div>
            </form>
        </div>
    </div>
</div>
